<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#0f172a">

  <title>Presensi Digital SDN 2 Cihirup</title>

  <!-- ==================================================
       HTML5 QR CODE
  =================================================== -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    /* ==================================================
       DASAR
    =================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background:
        linear-gradient(
          135deg,
          #0f172a,
          #172554,
          #064e3b
        );
      color: #ffffff;
    }


    body {
      min-height: 100vh;
    }


    button {
      font-family: inherit;
    }


    /* ==================================================
       CONTAINER UTAMA
    =================================================== */

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 14px;
    }


    /* ==================================================
       HEADER
    =================================================== */

    .header {
      text-align: center;
      padding: 14px 10px 10px;
    }


    .logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      border-radius: 50%;
      background: #ffffff;
      padding: 5px;
      box-shadow:
        0 8px 25px rgba(0,0,0,.28);
    }


    .school {
      margin-top: 10px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .4px;
    }


    .subtitle {
      margin-top: 5px;
      font-size: 14px;
      opacity: .85;
    }


    /* ==================================================
       STATUS SCANNER
    =================================================== */

    .scanner-status {
      margin: 12px 0;
      padding: 10px 14px;
      border-radius: 999px;
      text-align: center;
      background:
        rgba(255,255,255,.12);
      border:
        1px solid rgba(255,255,255,.16);
      font-size: 13px;
      font-weight: 700;
    }


    .scanner-status.ready {
      color: #bbf7d0;
    }


    .scanner-status.waiting {
      color: #fde68a;
    }


    .scanner-status.error {
      color: #fecaca;
    }


    /* ==================================================
       SCANNER
    =================================================== */

    .scanner-card {
      position: relative;
      overflow: hidden;
      background: #020617;
      border-radius: 24px;
      padding: 10px;
      box-shadow:
        0 20px 50px rgba(0,0,0,.35);
    }


    #reader {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #000000;
      min-height: 280px;
    }


    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover !important;
      border-radius: 18px;
    }


    /* ==================================================
       FRAME SCANNER
    =================================================== */

    .scan-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(255,255,255,.9);
      border-radius: 20px;
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.18);
    }


    .scan-line {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 20%;
      height: 3px;
      background: #22c55e;
      box-shadow:
        0 0 12px #22c55e;
      animation: scanLine 2s linear infinite;
    }


    @keyframes scanLine {

      0% {
        top: 15%;
      }

      50% {
        top: 80%;
      }

      100% {
        top: 15%;
      }

    }


    /* ==================================================
       PETUNJUK
    =================================================== */

    .instruction {
      text-align: center;
      margin: 12px 5px;
      font-size: 14px;
      line-height: 1.5;
      opacity: .88;
    }


    .nis-example {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 9px;
      border-radius: 8px;
      background:
        rgba(255,255,255,.1);
      font-family: monospace;
      font-weight: 700;
    }


    /* ==================================================
       TOMBOL
    =================================================== */

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }


    .btn {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: .15s ease;
    }


    .btn:active {
      transform: scale(.97);
    }


    .btn-start {
      background: #22c55e;
      color: #052e16;
    }


    .btn-stop {
      background: #ef4444;
      color: #ffffff;
    }


    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }


    /* ==================================================
       HASIL PRESENSI
    =================================================== */

    .result {
      display: none;
      margin-top: 18px;
      padding: 20px;
      border-radius: 22px;
      background:
        rgba(255,255,255,.97);
      color: #0f172a;
      box-shadow:
        0 20px 50px rgba(0,0,0,.3);
      text-align: center;
      animation: resultIn .25s ease-out;
    }


    @keyframes resultIn {

      from {
        opacity: 0;
        transform: translateY(10px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    .result-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 38px;
      font-weight: 900;
    }


    .result.success .result-icon {
      background: #dcfce7;
      color: #16a34a;
    }


    .result.already .result-icon {
      background: #fef3c7;
      color: #d97706;
    }


    .result.notfound .result-icon {
      background: #fee2e2;
      color: #dc2626;
    }


    .result.inactive .result-icon {
      background: #ffedd5;
      color: #ea580c;
    }


    .result.error .result-icon {
      background: #e5e7eb;
      color: #374151;
    }


    .result-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
    }


    .result.success .result-title {
      color: #15803d;
    }


    .result.already .result-title {
      color: #b45309;
    }


    .result.notfound .result-title {
      color: #b91c1c;
    }


    .result.inactive .result-title {
      color: #c2410c;
    }


    .result-message {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 15px;
    }


    /* ==================================================
       DATA SISWA
    =================================================== */

    .student-box {
      background: #f8fafc;
      border-radius: 16px;
      padding: 14px;
      text-align: left;
    }


    .student-name {
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 12px;
      color: #0f172a;
    }


    .student-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-bottom:
        1px solid #e2e8f0;
      font-size: 14px;
    }


    .student-row:last-child {
      border-bottom: 0;
    }


    .label {
      color: #64748b;
    }


    .value {
      font-weight: 800;
      text-align: right;
      color: #0f172a;
    }


    .status-hadir {
      color: #16a34a;
      font-weight: 900;
    }


    /* ==================================================
       FOOTER
    =================================================== */

    .footer {
      text-align: center;
      margin-top: 18px;
      padding-bottom: 12px;
      font-size: 11px;
      opacity: .65;
    }


    /* ==================================================
       RESPONSIVE
    =================================================== */

    @media (max-width: 420px) {

      .school {
        font-size: 20px;
      }

      .logo {
        width: 72px;
        height: 72px;
      }

      .result-title {
        font-size: 21px;
      }

    }

  </style>
</head>


<body>

<div class="app">

  <!-- ==================================================
       HEADER
  =================================================== -->

  <header class="header">

    <img
      src="logo_sdn2_cihirup.png"
      class="logo"
      alt="Logo SDN 2 Cihirup"
    >

    <div class="school">
      PRESENSI DIGITAL
    </div>

    <div class="subtitle">
      SD NEGERI 2 CIHIRUP
    </div>

  </header>


  <!-- ==================================================
       STATUS
  =================================================== -->

  <div
    id="scannerStatus"
    class="scanner-status waiting"
  >
    SCANNER BELUM AKTIF
  </div>


  <!-- ==================================================
       SCANNER
  =================================================== -->

  <section class="scanner-card">

    <div id="reader"></div>

    <div class="scan-frame">
      <div class="scan-line"></div>
    </div>

  </section>


  <div class="instruction">

    Arahkan QR Code kartu siswa
    ke dalam kotak scanner.

    <br>

    QR Code berisi NIS, contoh:

    <div class="nis-example">
      262701001
    </div>

  </div>


  <!-- ==================================================
       TOMBOL
  =================================================== -->

  <div class="buttons">

    <button
      id="startBtn"
      class="btn btn-start"
      onclick="startScanner()"
    >
      📷 MULAI SCANNER
    </button>

    <button
      id="stopBtn"
      class="btn btn-stop"
      onclick="stopScanner()"
      disabled
    >
      ⛔ HENTIKAN
    </button>

  </div>


  <!-- ==================================================
       HASIL
  =================================================== -->

  <section
    id="result"
    class="result"
  >

    <div
      id="resultIcon"
      class="result-icon"
    >
      ✓
    </div>

    <div
      id="resultTitle"
      class="result-title"
    >
      PRESENSI BERHASIL
    </div>

    <div
      id="resultMessage"
      class="result-message"
    ></div>

    <div
      id="studentBox"
      class="student-box"
    >

      <div
        id="studentName"
        class="student-name"
      >
      </div>


      <div class="student-row">

        <span class="label">
          NIS
        </span>

        <span
          id="studentNis"
          class="value"
        >
        </span>

      </div>


      <div class="student-row">

        <span class="label">
          Kelas
        </span>

        <span
          id="studentClass"
          class="value"
        >
        </span>

      </div>


      <div class="student-row">

        <span class="label">
          Waktu
        </span>

        <span
          id="studentTime"
          class="value"
        >
        </span>

      </div>


      <div class="student-row">

        <span class="label">
          Status
        </span>

        <span
          id="studentStatus"
          class="value status-hadir"
        >
        </span>

      </div>

    </div>

  </section>


  <footer class="footer">

    Presensi Digital • SD Negeri 2 Cihirup

  </footer>

</div>


<script>

/* =====================================================
   KONFIGURASI BACKEND
===================================================== */

/*
 * PENTING:
 *
 * Ganti URL di bawah dengan URL WEB APP
 * Apps Script Bapak yang sudah bekerja.
 *
 * Harus berakhiran:
 *
 * /exec
 *
 */

const API_URL =
  'PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI';


/* =====================================================
   VARIABEL GLOBAL
===================================================== */

let scanner = null;

let scannerRunning = false;

let processingScan = false;

let lastScannedNis = '';

let lastScanTime = 0;

const SCAN_COOLDOWN = 2500;

const RESULT_DURATION = 2200;


/* =====================================================
   ELEMENT
===================================================== */

const statusEl =
  document.getElementById(
    'scannerStatus'
  );

const startBtn =
  document.getElementById(
    'startBtn'
  );

const stopBtn =
  document.getElementById(
    'stopBtn'
  );

const resultEl =
  document.getElementById(
    'result'
  );

const resultIcon =
  document.getElementById(
    'resultIcon'
  );

const resultTitle =
  document.getElementById(
    'resultTitle'
  );

const resultMessage =
  document.getElementById(
    'resultMessage'
  );

const studentBox =
  document.getElementById(
    'studentBox'
  );

const studentName =
  document.getElementById(
    'studentName'
  );

const studentNis =
  document.getElementById(
    'studentNis'
  );

const studentClass =
  document.getElementById(
    'studentClass'
  );

const studentTime =
  document.getElementById(
    'studentTime'
  );

const studentStatus =
  document.getElementById(
    'studentStatus'
  );


/* =====================================================
   STATUS SCANNER
===================================================== */

function setScannerStatus(
  text,
  type
) {

  statusEl.textContent = text;

  statusEl.className =
    'scanner-status ' +
    (type || '');

}


/* =====================================================
   START SCANNER
===================================================== */

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  if (
    !API_URL ||
    API_URL.includes(
      'PASTE_URL'
    )
  ) {

    showResult({

      type: 'error',

      title:
        'KONFIGURASI BELUM LENGKAP',

      message:
        'URL backend Apps Script belum diatur.',

      showStudent: false

    });

    return;
  }


  hideResult();


  setScannerStatus(
    'MEMULAI KAMERA...',
    'waiting'
  );


  startBtn.disabled = true;

  stopBtn.disabled = false;


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );
    }


    /*
     * Prioritaskan kamera belakang.
     */

    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(
        cam =>
          /back|rear|environment/i
            .test(
              cam.label || ''
            )
      );


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {
          width: 260,
          height: 260
        },

        aspectRatio:
          1.0,

        disableFlip: false

      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning = true;


    setScannerStatus(
      '🟢 SCANNER AKTIF — ARAHKAN QR KARTU',
      'ready'
    );


  } catch (error) {

    console.error(
      'Camera error:',
      error
    );


    scannerRunning = false;

    startBtn.disabled = false;

    stopBtn.disabled = true;


    setScannerStatus(
      'KAMERA TIDAK SIAP',
      'error'
    );


    showResult({

      type: 'error',

      title:
        'KAMERA TIDAK SIAP',

      message:
        'Pastikan izin kamera diberikan dan gunakan halaman melalui HTTPS.',

      showStudent: false

    });

  }

}


/* =====================================================
   SCAN FAILURE
===================================================== */

function onScanFailure(errorMessage) {

  /*
   * Sengaja dikosongkan.
   *
   * html5-qrcode memanggil fungsi ini
   * berkali-kali ketika belum menemukan QR.
   */

}


/* =====================================================
   QR BERHASIL TERBACA
===================================================== */

async function onScanSuccess(decodedText) {

  if (processingScan) {
    return;
  }


  const nis =
    String(decodedText || '')
      .trim();


  if (!nis) {
    return;
  }


  /*
   * Anti pembacaan berulang
   * dari kamera dalam waktu singkat.
   */

  const now =
    Date.now();


  if (
    nis === lastScannedNis &&
    now - lastScanTime <
      SCAN_COOLDOWN
  ) {

    return;
  }


  lastScannedNis = nis;

  lastScanTime = now;

  processingScan = true;


  /*
   * Matikan scanner
   * setelah QR berhasil dibaca.
   */

  await stopScanner();


  setScannerStatus(
    'QR TERBACA — MEMERIKSA DATA...',
    'waiting'
  );


  /*
   * Bunyi pendek saat QR terdeteksi.
   */

  playBeep(
    880,
    120
  );


  /*
   * Kirim NIS ke Apps Script.
   */

  requestPresensi(nis);

}


/* =====================================================
   REQUEST PRESENSI
===================================================== */

function requestPresensi(nis) {

  const callbackName =
    'presensiCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 10000
    );


  window[callbackName] =
    function(data) {

      try {

        handlePresensiResult(
          data
        );

      } finally {

        delete window[
          callbackName
        ];

      }

    };


  const url =
    API_URL +
    '?action=scan' +
    '&nis=' +
    encodeURIComponent(nis) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    );


  const script =
    document.createElement(
      'script'
    );


  script.src = url;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      handlePresensiResult({

        ok: false,

        code: 'NETWORK_ERROR',

        message:
          'Tidak dapat terhubung ke server presensi.'

      });

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   HASIL DARI BACKEND
===================================================== */

function handlePresensiResult(
  data
) {

  console.log(
    'Presensi result:',
    data
  );


  if (!data) {

    showResult({

      type: 'error',

      title:
        'RESPON TIDAK VALID',

      message:
        'Server tidak mengirimkan data yang dapat dibaca.',

      showStudent: false

    });

    finishResult();

    return;
  }


  /* -----------------------------------------------
     SUCCESS
  ------------------------------------------------ */

  if (
    data.code ===
    'SUCCESS'
  ) {

    showResult({

      type: 'success',

      title:
        'PRESENSI BERHASIL',

      message:
        'Presensi siswa telah berhasil dicatat.',

      student:
        data.student,

      waktu:
        data.waktu,

      status:
        data.status || 'Hadir',

      showStudent: true

    });


    playSuccessSound();


  }


  /* -----------------------------------------------
     ALREADY
  ------------------------------------------------ */

  else if (
    data.code ===
    'ALREADY'
  ) {

    showResult({

      type: 'already',

      title:
        'SUDAH PRESENSI',

      message:
        'Siswa ini sudah melakukan presensi hari ini.',

      student:
        data.student,

      waktu:
        data.waktu,

      status:
        data.status || 'Hadir',

      showStudent: true

    });


    playAlreadySound();


  }


  /* -----------------------------------------------
     NOT FOUND
  ------------------------------------------------ */

  else if (
    data.code ===
    'NOT_FOUND'
  ) {

    showResult({

      type: 'notfound',

      title:
        'QR CODE TIDAK TERDAFTAR',

      message:
        'NIS tidak ditemukan dalam database siswa.',

      student: {

        nis:
          data.nis || ''

      },

      showStudent: true

    });


    playErrorSound();


  }


  /* -----------------------------------------------
     INACTIVE
  ------------------------------------------------ */

  else if (
    data.code ===
    'INACTIVE'
  ) {

    showResult({

      type: 'inactive',

      title:
        'DATA SISWA TIDAK AKTIF',

      message:
        'Siswa belum dapat melakukan presensi. Silakan hubungi wali kelas.',

      student:
        data.student,

      showStudent: true

    });


    playErrorSound();


  }


  /* -----------------------------------------------
     ERROR LAINNYA
  ------------------------------------------------ */

  else {

    showResult({

      type: 'error',

      title:
        'PRESENSI TIDAK DAPAT DIPROSES',

      message:
        data.message ||
        'Terjadi kesalahan pada sistem.',

      student:
        data.student,

      showStudent:
        !!data.student

    });


    playErrorSound();

  }


  finishResult();

}


/* =====================================================
   MENAMPILKAN HASIL
===================================================== */

function showResult(options) {

  resultEl.className =
    'result ' +
    (options.type || 'error');


  resultIcon.textContent =
    getResultIcon(
      options.type
    );


  resultTitle.textContent =
    options.title ||
    'HASIL PRESENSI';


  resultMessage.textContent =
    options.message ||
    '';


  const student =
    options.student;


  if (
    options.showStudent &&
    student
  ) {

    studentBox.style.display =
      'block';


    studentName.textContent =
      student.nama ||
      '';


    studentNis.textContent =
      student.nis ||
      '';


    studentClass.textContent =
      student.kelas ||
      '';


    studentTime.textContent =
      options.waktu ||
      '';


    studentStatus.textContent =
      options.status ||
      '';


  } else {

    studentBox.style.display =
      'none';

  }


  resultEl.style.display =
    'block';


  /*
   * Scroll agar hasil terlihat
   * pada HP kecil.
   */

  setTimeout(
    () => {

      resultEl.scrollIntoView({

        behavior: 'smooth',

        block: 'center'

      });

    },

    50
  );

}


/* =====================================================
   ICON HASIL
===================================================== */

function getResultIcon(type) {

  switch(type) {

    case 'success':
      return '✓';

    case 'already':
      return '⏱';

    case 'notfound':
      return '✕';

    case 'inactive':
      return '⚠';

    default:
      return '!';

  }

}


/* =====================================================
   SEMBUNYIKAN HASIL
===================================================== */

function hideResult() {

  resultEl.style.display =
    'none';

}


/* =====================================================
   SETELAH HASIL
===================================================== */

function finishResult() {

  /*
   * Tunggu sebentar agar guru
   * sempat membaca hasil.
   */

  setTimeout(

    async () => {

      hideResult();


      processingScan =
        false;


      setScannerStatus(
        'MENYIAPKAN SCANNER...',
        'waiting'
      );


      /*
       * Reset scanner.
       */

      await startScanner();

    },

    RESULT_DURATION

  );

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

  if (
    scanner &&
    scannerRunning
  ) {

    try {

      await scanner.stop();

    } catch(error) {

      console.warn(
        'Stop scanner:',
        error
      );

    }


    try {

      await scanner.clear();

    } catch(error) {

      console.warn(
        'Clear scanner:',
        error
      );

    }

  }


  scannerRunning =
    false;


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  setScannerStatus(
    'SCANNER BERHENTI',
    'waiting'
  );

}


/* =====================================================
   BEEP DASAR
===================================================== */

function playBeep(
  frequency,
  duration
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime +
        duration / 1000
    );


    oscillator.connect(gain);

    gain.connect(
      ctx.destination
    );


    oscillator.start();


    oscillator.stop(
      ctx.currentTime +
      duration / 1000 +
      0.03
    );

  } catch(error) {

    console.warn(
      'Audio:',
      error
    );

  }

}
