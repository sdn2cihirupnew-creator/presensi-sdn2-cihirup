<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi Digital SD Negeri 2 Cihirup</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef6ff,#f7fbff);color:#17365d}
.header{background:linear-gradient(135deg,#0759a8,#147bea);color:#fff;padding:28px 7%;display:flex;align-items:center;gap:22px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.header-logo{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:18px;padding:7px}
.header-title{font-size:34px;font-weight:800;letter-spacing:.5px}
.header-school{font-size:20px;margin-top:5px;opacity:.95}
.container{max-width:1450px;margin:35px auto;padding:0 25px}
.card{background:#fff;border-radius:25px;padding:30px;margin-bottom:25px;box-shadow:0 8px 30px rgba(24,72,120,.10)}
.login-wrapper{min-height:calc(100vh - 170px);display:flex;justify-content:center;align-items:center}
.login-card{width:100%;max-width:650px;text-align:center}
.login-logo{width:125px;height:125px;object-fit:contain;margin-bottom:15px}
.login-title{color:#075db3;font-size:42px;font-weight:800;margin:10px 0}
.login-subtitle{color:#66809e;font-size:20px;margin-bottom:35px}
.form-group{text-align:left;margin-bottom:22px}
.form-group label{display:block;font-size:18px;font-weight:700;margin-bottom:9px}
input,select{width:100%;padding:17px 18px;border:1px solid #cbd9e8;border-radius:14px;font-size:17px;outline:none;background:#fff}
input:focus,select:focus{border-color:#147bea;box-shadow:0 0 0 3px rgba(20,123,234,.12)}
.btn{border:0;border-radius:14px;padding:16px 25px;font-size:17px;font-weight:800;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#0865c4,#147bea);color:#fff}
.btn-danger{background:#e63946;color:#fff}
.btn-refresh{background:#147bea;color:#fff}
.message{margin-top:18px;padding:15px;border-radius:12px;font-weight:700;display:none}
.message.error{display:block;background:#ffe8e8;color:#c62828}
.message.success{display:block;background:#e8f8ed;color:#18733b}
.welcome{display:flex;align-items:center;justify-content:space-between;gap:20px}
.welcome-title{color:#075db3;font-size:34px;font-weight:800}
.welcome-sub{margin-top:8px;font-size:18px;color:#69809a}
.filter{display:grid;grid-template-columns:250px 1fr 250px auto;gap:18px;align-items:end}
.filter label{display:block;font-weight:700;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.stat{background:#fff;border-radius:20px;padding:25px;border-top:6px solid #147bea;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.stat-title{color:#70849a;font-size:15px;font-weight:800;text-transform:uppercase}
.stat-value{color:#075db3;font-size:42px;font-weight:900;margin-top:10px}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#edf5fd;color:#17466f;padding:15px;text-align:left;white-space:nowrap}
td{padding:14px 15px;border-bottom:1px solid #e5edf5}
tr:hover{background:#f8fbff}
.badge{display:inline-block;padding:7px 13px;border-radius:20px;font-weight:800;font-size:13px}
.badge-hadir{background:#e8f8ed;color:#16813e}
.badge-sakit{background:#fff4d6;color:#9a6a00}
.badge-izin{background:#e9f0ff;color:#2455a6}
.badge-alpa{background:#ffe5e5;color:#b71c1c}
.badge-belum{background:#eef1f4;color:#657789}
.loading{display:none;text-align:center;padding:25px;color:#147bea;font-weight:800}
.footer{text-align:center;padding:25px;color:#7990a8}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.filter{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.header{padding:20px}.header-logo{width:65px;height:65px}.header-title{font-size:24px}.header-school{font-size:15px}.container{padding:0 12px}.card{padding:20px;border-radius:18px}.login-title{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.filter{grid-template-columns:1fr}.welcome{flex-direction:column;align-items:flex-start}}
@media(max-width:450px){.stats{grid-template-columns:1fr}.stat-value{font-size:36px}}
</style>
</head>
<body>

<header class="header">
  <img id="headerLogo" class="header-logo" alt="Logo SDN 2 Cihirup">
  <div>
    <div class="header-title">PRESENSI DIGITAL</div>
    <div class="header-school">SD NEGERI 2 CIHIRUP</div>
  </div>
</header>

<section id="loginPage" class="login-wrapper">
  <div class="card login-card">
    <img id="loginLogo" class="login-logo" alt="Logo SDN 2 Cihirup">
    <div class="login-title">Login Wali Kelas</div>
    <div class="login-subtitle">Dashboard Presensi Digital</div>

    <div class="form-group">
      <label>USER ID</label>
      <input id="userId" type="text" autocomplete="username" placeholder="Contoh: WK05">
    </div>

    <div class="form-group">
      <label>PIN</label>
      <input id="pin" type="password" autocomplete="current-password" placeholder="Masukkan PIN">
    </div>

    <button id="loginBtn" class="btn btn-primary" style="width:100%" onclick="doLogin()">MASUK</button>
    <div id="loginMessage" class="message"></div>
  </div>
</section>

<section id="dashboardPage" style="display:none">
  <div class="container">

    <div class="card welcome">
      <div>
        <div id="welcomeName" class="welcome-title"></div>
        <div id="welcomeRole" class="welcome-sub"></div>
      </div>
      <button class="btn btn-danger" onclick="doLogout()">KELUAR</button>
    </div>

    <div class="card">
      <div class="filter">
        <div>
          <label>Tanggal Presensi</label>
          <input id="tanggal" type="date">
        </div>
        <div>
          <label>Cari Siswa</label>
          <input id="search" type="text" placeholder="Nama atau NIS..." oninput="filterTable()">
        </div>
        <div>
          <label>Status</label>
          <select id="statusFilter" onchange="filterTable()">
            <option value="">Semua Status</option>
            <option value="Hadir">Hadir</option>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
            <option value="Alpa">Alpa</option>
            <option value="Belum Presensi">Belum Presensi</option>
          </select>
        </div>
        <button class="btn btn-refresh" onclick="loadDashboard()">↻ TAMPILKAN</button>
      </div>
    </div>

    <div id="loading" class="loading">Memuat data presensi...</div>

    <div class="stats">
      <div class="stat"><div class="stat-title">Total Siswa</div><div id="totalSiswa" class="stat-value">0</div></div>
      <div class="stat" style="border-top-color:#18a558"><div class="stat-title">Hadir</div><div id="hadir" class="stat-value">0</div></div>
      <div class="stat" style="border-top-color:#f2b705"><div class="stat-title">Sakit</div><div id="sakit" class="stat-value">0</div></div>
      <div class="stat" style="border-top-color:#315ee7"><div class="stat-title">Izin</div><div id="izin" class="stat-value">0</div></div>
      <div class="stat" style="border-top-color:#e63946"><div class="stat-title">Alpa</div><div id="alpa" class="stat-value">0</div></div>
      <div class="stat" style="border-top-color:#9aa9b8"><div class="stat-title">Belum Presensi</div><div id="belum" class="stat-value">0</div></div>
    </div>

    <div class="card" style="margin-top:25px">
      <h2>Daftar Presensi Siswa</h2>
      <p id="tanggalInfo" style="color:#71869c"></p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th><th>NIS</th><th>Nama Siswa</th><th>Kelas</th>
              <th>Status</th><th>Waktu</th><th>Keterangan</th>
            </tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>
    </div>

    <div class="footer">Presensi Digital • SD Negeri 2 Cihirup • V7.3 Final</div>
  </div>
</section>

let session={userId:'',token:'',user:null};
let dashboardData=[];

window.onload=function(){
  document.getElementById('headerLogo').src=LOGO_DATA;
  document.getElementById('loginLogo').src=LOGO_DATA;
  setToday();

  const saved=localStorage.getItem('presensiSessionV73');
  if(saved){
    try{
      const data=JSON.parse(saved);
      session=data;
      if(session.userId&&session.token){
        showDashboard();
        loadDashboard();
      }
    }catch(err){
      localStorage.removeItem('presensiSessionV73');
    }
  }
};

function setToday(){
  const d=new Date();
  const yyyy=d.getFullYear();
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  document.getElementById('tanggal').value=yyyy+'-'+mm+'-'+dd;
}

function doLogin(){
  const userId=document.getElementById('userId').value.trim();
  const pin=document.getElementById('pin').value.trim();
  const btn=document.getElementById('loginBtn');

  if(!userId){showLoginError('USER ID wajib diisi.');return;}
  if(!pin){showLoginError('PIN wajib diisi.');return;}

  btn.disabled=true;
  btn.innerText='MEMERIKSA LOGIN...';

  google.script.run
    .withSuccessHandler(function(result){
      btn.disabled=false;
      btn.innerText='MASUK';

      if(!result||!result.ok){
        showLoginError(result&&result.message?result.message:'Login gagal.');
        return;
      }

      session={
        userId:result.user.userId,
        token:result.token,
        user:result.user
      };

      localStorage.setItem('presensiSessionV73',JSON.stringify(session));
      showDashboard();
      loadDashboard();
    })
    .withFailureHandler(function(error){
      btn.disabled=false;
      btn.innerText='MASUK';
      showLoginError(error.message||'Terjadi kesalahan.');
    })
    .login(userId,pin);
}

function showLoginError(text){
  const msg=document.getElementById('loginMessage');
  msg.className='message error';
  msg.innerText=text;
}

function showDashboard(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('dashboardPage').style.display='block';

  if(session.user){
    document.getElementById('welcomeName').innerText='Selamat datang, '+session.user.nama;
    document.getElementById('welcomeRole').innerText=session.user.role+' • Kelas '+session.user.kelas;
  }
}

function loadDashboard(){
  const tanggal=document.getElementById('tanggal').value;
  document.getElementById('loading').style.display='block';

  google.script.run
    .withSuccessHandler(function(result){
      document.getElementById('loading').style.display='none';

      if(!result||!result.ok){
        if(result&&result.code==='SESSION_INVALID'){
          alert('Sesi login sudah berakhir. Silakan login kembali.');
          doLogout();
          return;
        }
        alert(result&&result.message?result.message:'Gagal memuat dashboard.');
        return;
      }

      const d=result.dashboard;
      document.getElementById('totalSiswa').innerText=d.totalSiswa;
      document.getElementById('hadir').innerText=d.ringkasan.hadir;
      document.getElementById('sakit').innerText=d.ringkasan.sakit;
      document.getElementById('izin').innerText=d.ringkasan.izin;
      document.getElementById('alpa').innerText=d.ringkasan.alpa;
      document.getElementById('belum').innerText=d.ringkasan.belum;
      document.getElementById('tanggalInfo').innerText='Data presensi tanggal '+d.tanggalTampilan;

      dashboardData=d.siswa||[];
      renderTable(dashboardData);
    })
    .withFailureHandler(function(error){
      document.getElementById('loading').style.display='none';
      alert(error.message||'Terjadi kesalahan.');
    })
    .getDashboard(session.userId,session.token,tanggal);
}

function renderTable(rows){
  const tbody=document.getElementById('studentTable');
  tbody.innerHTML='';

  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px">Tidak ada data siswa.</td></tr>';
    return;
  }

  rows.forEach(function(student){
    const tr=document.createElement('tr');
    tr.innerHTML=
      '<td>'+escapeHtml(student.no)+'</td>'+
      '<td>'+escapeHtml(student.nis)+'</td>'+
      '<td><strong>'+escapeHtml(student.nama)+'</strong></td>'+
      '<td>'+escapeHtml(student.kelas)+'</td>'+
      '<td>'+badge(student.status)+'</td>'+
      '<td>'+escapeHtml(student.waktu||'-')+'</td>'+
      '<td>'+escapeHtml(student.keterangan||'-')+'</td>';
    tbody.appendChild(tr);
  });
}

function badge(status){
  const s=String(status||'').toLowerCase();
  let cls='badge-belum';
  if(s==='hadir')cls='badge-hadir';
  else if(s==='sakit')cls='badge-sakit';
  else if(s==='izin')cls='badge-izin';
  else if(s==='alpa')cls='badge-alpa';
  return '<span class="badge '+cls+'">'+escapeHtml(status)+'</span>';
}

function filterTable(){
  const search=document.getElementById('search').value.toLowerCase().trim();
  const status=document.getElementById('statusFilter').value;

  const filtered=dashboardData.filter(function(student){
    const matchSearch=!search||
      student.nama.toLowerCase().includes(search)||
      student.nis.toLowerCase().includes(search);
    const matchStatus=!status||student.status===status;
    return matchSearch&&matchStatus;
  });

  renderTable(filtered);
}

function doLogout(){
  const old=Object.assign({},session);
  session={userId:'',token:'',user:null};
  localStorage.removeItem('presensiSessionV73');

  document.getElementById('dashboardPage').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('pin').value='';
  document.getElementById('loginMessage').className='message';

  if(old.userId&&old.token){
    google.script.run.logout(old.userId,old.token);
  }
}

function escapeHtml(value){
  return String(value==null?'':value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
